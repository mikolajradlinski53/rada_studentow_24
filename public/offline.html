<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <title>Brak połączenia · RadaStudentów24</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
      background: #09090b; color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 22rem; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 20px 0 8px; font-size: 1.125rem; font-weight: 600; }
    p { margin: 0; color: #a1a1aa; font-size: 0.875rem; line-height: 1.5; }
    button {
      margin-top: 24px; width: 100%; padding: 14px; border: 0; border-radius: 12px;
      background: #2563eb; color: #fff; font: inherit; font-weight: 600; font-size: 0.9375rem;
    }
    button:active { transform: scale(0.98); }
    @media (prefers-color-scheme: light) {
      :root { color-scheme: light; }
      body { background: #f2f2f7; color: #1c1c1f; }
      p { color: #55555b; }
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Brak połączenia z internetem</h1>
    <p>Głosowania i obecność wymagają połączenia na żywo. Sprawdź Wi-Fi lub dane komórkowe i spróbuj ponownie.</p>
    <button onclick="location.reload()">Spróbuj ponownie</button>
  </main>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
